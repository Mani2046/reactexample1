<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var day=prompt("Enter the day: ");
        switch(day){
            case "monday":
                document.write("Today is Monday");
                break;
            case "tuesday":
                document.write("Today is Tuesday");
                break;
                default:
                    document.write("wrong day");
           
        }
    </script>
</body>
</html>
